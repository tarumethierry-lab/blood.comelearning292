<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thierry AI
    </title>
    <!-- Math.js Library for Parsing & Calculations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.1/math.js"></script>
    <!-- MathJax Library for Mathematical Rendering -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .solver-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            padding: 12px 20px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .output-box {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 15px;
            min-height: 50px;
            word-wrap: break-word;
        }
        .examples {
            margin-top: 15px;
            font-size: 13px;
            color: #6c757d;
        }
    </style>
</head>
<body>

<div class="solver-card">
    <h2>Thierry AI Math Problem Solver</h2>
    
    <div class="input-group">
        <input type="text" id="mathInput" placeholder="Enter problem (e.g. 5cm + 2inch or derivative('x^2', 'x'))">
        <button onclick="solveProblem()">Solve</button>
    </div>

    <div class="output-box" id="output">Result will appear here...</div>

    <div class="examples">
        <strong>Supported Examples:</strong>
        <ul>
            <li><code>1.2 / (3.3 + 1.7)</code></li>
            <li><code>derivative('x^2 + 3x', 'x')</code></li>
            <li><code>5.08 cm + 2 inch</code></li>
            <li><code>det([[1, 2], [3, 4]])</code></li>
            <li><code>simplify('2x + 3x - a')</code></li>
        </ul>
    </div>
</div>

<script>
    function solveProblem() {
        const input = document.getElementById('mathInput').value;
        const outputDiv = document.getElementById('output');

        if (!input.trim()) {
            outputDiv.innerHTML = "<span style='color:red;'>Please enter a mathematical expression.</span>";
            return;
        }

        try {
            // Evaluate the mathematical expression using Math.js
            const result = math.evaluate(input);
            
            // Format output for HTML display
            let formattedResult = math.format(result, { precision: 14 });
            
            // Render result cleanly
            outputDiv.innerHTML = `<strong>Result:</strong> ${formattedResult}`;

            // Re-render math typesetting if LaTeX output is returned
            if (window.MathJax) {
                MathJax.typesetPromise([outputDiv]);
            }
        } catch (error) {
            outputDiv.innerHTML = `<span style='color:red;'><strong>Error:</strong> ${error.message}</span>`;
        }
    }

    // Allow pressing "Enter" key to trigger solving
    document.getElementById("mathInput").addEventListener("keyup", function(event) {
        if (event.key === "Enter") {
            solveProblem();
        }
    });
</script>
created by Thierry Tarume
</body>
</html>
